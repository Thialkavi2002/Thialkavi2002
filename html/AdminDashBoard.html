<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .form-card, .admin-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-card h2 {
      margin-bottom: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    button {
      padding: 10px 15px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button.add {
      background: #27ae60;
      color: white;
    }
    button.edit {
      background: #2980b9;
      color: white;
      margin-right: 5px;
    }
    button.delete {
      background: #c0392b;
      color: white;
    }
    .admin-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
  </header>

  <div class="container">
    <!-- Form -->
    <div class="form-card">
      <h2 id="form-title">Add Admin</h2>
      <form id="admin-form">
        <input type="text" id="name" placeholder="Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="phone" placeholder="Phone" required />
        <button type="submit" class="add">Add Admin</button>
      </form>
    </div>

    <!-- Admin list -->
    <div class="admin-list" id="admin-list"></div>
  </div>

  <script>
    const API_URL = "http://localhost:5000/api/admins";
    const adminList = document.getElementById("admin-list");
    const form = document.getElementById("admin-form");
    const formTitle = document.getElementById("form-title");

    let editingId = null;

    // Fetch all admins
    async function fetchAdmins() {
      const res = await fetch(API_URL);
      const data = await res.json();
      renderAdmins(data.data);
    }

    // Render admins
    function renderAdmins(admins) {
      adminList.innerHTML = "";
      admins.forEach(admin => {
        const card = document.createElement("div");
        card.className = "admin-card";
        card.innerHTML = `
          <h3>${admin.name}</h3>
          <p>Email: ${admin.email}</p>
          <p>Phone: ${admin.phones?.map(p => p.phone).join(", ") || "-"}</p>
          <button class="edit" onclick="editAdmin('${admin._id}', '${admin.name}', '${admin.email}', '${admin.phones?.[0]?.phone || ""}')">Edit</button>
          <button class="delete" onclick="deleteAdmin('${admin._id}')">Delete</button>
        `;
        adminList.appendChild(card);
      });
    }

    // Add or update admin
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const adminData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phones: [{ phone: document.getElementById("phone").value }]
      };

      if (editingId) {
        await fetch(`${API_URL}/${editingId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(adminData)
        });
        editingId = null;
        formTitle.textContent = "Add Admin";
        form.querySelector("button").textContent = "Add Admin";
      } else {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(adminData)
        });
      }

      form.reset();
      fetchAdmins();
    });

    // Edit admin
    window.editAdmin = (id, name, email, phone) => {
      document.getElementById("name").value = name;
      document.getElementById("email").value = email;
      document.getElementById("phone").value = phone;
      editingId = id;
      formTitle.textContent = "Edit Admin";
      form.querySelector("button").textContent = "Update Admin";
    };

    // Delete admin
    window.deleteAdmin = async (id) => {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      fetchAdmins();
    };

    // Initial load
    fetchAdmins();
  </script>
</body>
</html>
